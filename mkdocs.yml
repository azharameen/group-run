site_name: "Companion Docs"
site_description: "Documentation for the Companion multi-agent AI platform."
site_author: "azharameen"
site_url: "https://azharameen.github.io/group-run/"
repo_url: "https://github.com/azharameen/group-run"
repo_name: "azharameen/group-run"
edit_uri: "edit/develop/docs/"

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    logo: material/robot
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - toc.follow
    - announce.dismiss

nav:
  - Home & Getting Started:
      - Home: index.md
      - Setup Guide: GETTING_STARTED.md
      - Deployment: DEPLOYMENT.md
  - Product:
      - Product Overview: product-context.md
      - Requirements (PRD): prd.md
      - Capabilities & Features: features.md
  - Engineering Hub:
      - Architecture:
          - Overview: architecture.md
          - Architecture Decisions: architecture-decisions.md
          - ADR Template: architecture/adr-template.md
          - Architecture Spine (BMad): architecture/spine.md
      - Build & Integration:
          - API Reference (Scalar): api/scalar.md
          - Backend Agents: agents.md
          - SSE Streaming: sse-streaming.md
          - Frontend Plan: frontend-plan.md
          - UI Design: ui-design.md
      - Quality & Delivery:
          - Testing Guide: testing.md
          - Performance Testing: performance-testing.md
          - CI/CD Overview: cicd/overview.md
          - Automation Index: generated/workflows.md
          - Code Review Guidelines: code-review-guidelines.md
      - Engineering Standards:
          - Coding Guidelines: coding-guidelines.md
          - Technical Debt Policy: technical-debt-policy.md
      - Planning & Operations:
          - Epics Overview: epics/index.md
          - Sprint 1: epics/sprint-1.md
          - Tasks: tasks.md
          - Project Context (AI Rules): context/project-context.md
      - Archive:
          - Feature Roadmap (Phases 0–7): feature-roadmap.md
          - Phased Plan (Phases 0–7): phased-plan.md
          - Milestone Tracker (Phases 0–7): milestone-tracker.md
          - Current State Audit (Phases 0–7): current-state-audit.md
          - Target Architecture (Phases 0–7): target-architecture.md
  - AI & Community:
      - Context Guide: ai-agents/context-guide.md
      - Changelog: CHANGELOG.md
      - Contributing: CONTRIBUTING.md
      - License: LICENSE.md

plugins:
  - search:
      lang: en
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
  - include-markdown:
      opening_tag: "{!"
      closing_tag: "!}"
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      width: 100%
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
  - gen-files:
      scripts:
        - docs/gen_pages.py
  - macros:
      module_name: docs/macros
  - llmstxt:
      markdown_description: |
        Group Run is a multi-agent AI platform powered by LangGraph and DeepAgents.
        Backend: FastAPI + LangGraph on GCP Cloud Run. Frontend: React + Vite on Firebase Hosting.
        Agents follow a supervisor-router pattern defined in teams.yaml.
        MCP tools are loaded at runtime from mcp.json.
      sections:
        Getting Started:
          - GETTING_STARTED.md
          - DEPLOYMENT.md
        Architecture:
          - architecture.md
          - architecture-decisions.md
        Product:
          - prd.md
          - features.md
        API Reference:
          - api/scalar.md
        Backend:
          - agents.md
          - sse-streaming.md
        Frontend:
          - frontend-plan.md
          - ui-design.md
        Testing:
          - testing.md
          - performance-testing.md
        Standards:
          - coding-guidelines.md
          - technical-debt-policy.md
        CI/CD:
          - cicd/overview.md
        For AI Agents:
          - ai-agents/context-guide.md
        Community:
          - CHANGELOG.md
          - CONTRIBUTING.md
  - redirects:
      redirect_maps: {}

hooks:
  - hooks/copy_bmad_artifacts.py

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      title: On this page
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/azharameen/group-run
      name: GitHub
  generator: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/scalar-init.js
