services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ideator-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro
      - ./instructions:/app/instructions:ro
      - ./workspace:/app/workspace
      - ./knowledge-base:/app/knowledge-base
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ideator-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
