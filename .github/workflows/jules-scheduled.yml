# .github/workflows/jules-scheduled.yml
#
# Phase B3: Scheduled Jules tasks
# =================================
# Reads task definitions from jules-tasks.yaml and dispatches enabled tasks
# to Jules on their configured cron schedules.
#
# All tasks run with requirePlanApproval: true (default) so a human always
# reviews the plan before Jules starts coding.
#
# Required secrets:
#   JULES_API_KEY  — from https://jules.google.com/settings

name: "Jules: Scheduled Tasks"

on:
  # Each task in jules-tasks.yaml has its own schedule.
  # We use a single "router" workflow that runs frequently and dispatches
  # only the tasks whose scheduled time matches the current run time.
  # Simplest approach: run hourly and let the task's cron field act as a gate.
  schedule:
    - cron: "0 3 * * 1"  # dep audit — Monday 03:00
    - cron: "0 4 * * 1"  # TODO sweep — Monday 04:00
    - cron: "0 5 * * 3"  # coverage  — Wednesday 05:00
  workflow_dispatch:
    inputs:
      task_id:
        description: "Specific task ID to run (leave blank to run all enabled tasks)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Dry run: print tasks without dispatching to Jules"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

env:
  JULES_API_BASE: "https://jules.googleapis.com/v1alpha"

jobs:
  dispatch-scheduled-tasks:
    name: "Dispatch scheduled Jules tasks"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write

    steps:
      - name: "Check out repository"
        uses: actions/checkout@v4

      - name: "Install PyYAML"
        run: pip install pyyaml --quiet

      - name: "Read and dispatch tasks"
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          SPECIFIC_TASK: ${{ inputs.task_id || '' }}
          TRIGGER_CRON: ${{ github.event.schedule || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - << 'PYEOF'
          import json, os, sys, subprocess
          import urllib.request, urllib.error

          try:
              import yaml
          except ImportError:
              print("pyyaml not installed"); sys.exit(1)

          with open("jules-tasks.yaml") as f:
              config = yaml.safe_load(f)

          tasks = config.get("tasks", [])
          if not isinstance(tasks, list):
              print("::error::jules-tasks.yaml must contain a tasks list")
              sys.exit(1)
          api_key = os.environ.get("JULES_API_KEY", "")
          dry_run = os.environ.get("DRY_RUN", "false").lower() == "true"
          specific = os.environ.get("SPECIFIC_TASK", "").strip()
          trigger_cron = os.environ.get("TRIGGER_CRON", "").strip()
          api_base = os.environ.get("JULES_API_BASE", "https://jules.googleapis.com/v1alpha")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          server_url = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
          run_id = os.environ.get("GITHUB_RUN_ID", "")

          if not api_key and not dry_run:
              print("::error::JULES_API_KEY secret is not set")
              sys.exit(1)

          # Find connected source for this repo
          source_name = ""
          if api_key:
              try:
                  req = urllib.request.Request(f"{api_base}/sources?pageSize=50", headers={"x-goog-api-key": api_key})
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      data = json.loads(resp.read())
                  owner, repo_name = repo.split("/", 1) if "/" in repo else ("", "")
                  for s in data.get("sources", []):
                      gr = s.get("githubRepo", {})
                      if gr.get("owner","").lower() == owner.lower() and gr.get("name","").lower() == repo_name.lower():
                          source_name = s["name"]
                          break
              except Exception as e:
                  print(f"::warning::Could not list Jules sources: {e}")

          failures = 0
          for task in tasks:
              tid = task.get("id", "")
              if specific and tid != specific:
                  continue
              if not specific and trigger_cron and task.get("schedule", "").strip() != trigger_cron:
                  continue
              if not task.get("enabled", True):
                  print(f"Skipping disabled task: {tid}")
                  continue

              title = task.get("title", tid)
              prompt = task.get("prompt", "").strip()
              require_approval = str(task.get("require_plan_approval", True)).lower() == "true"
              auto_pr = str(task.get("auto_create_pr", True)).lower() == "true"

              print(f"\n{'[DRY RUN] ' if dry_run else ''}Dispatching task: {tid} — {title}")

              if dry_run:
                  print(f"  prompt: {prompt[:120]}...")
                  continue

              if not prompt:
                  print(f"::warning::Task {tid} has no prompt, skipping")
                  continue

              # Build payload
              payload = {
                  "prompt": prompt,
                  "title": f"[Jules Sched] {title}",
                  "requirePlanApproval": require_approval,
                  "automationMode": "AUTO_CREATE_PR" if auto_pr else "AUTOMATION_MODE_UNSPECIFIED",
              }
              if source_name:
                  payload["source"] = {"source": source_name}

              try:
                  body = json.dumps(payload).encode()
                  req = urllib.request.Request(f"{api_base}/sessions", data=body,
                      headers={"x-goog-api-key": api_key, "Content-Type": "application/json"}, method="POST")
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      result = json.loads(resp.read())
                  session_url = result.get("url", "")
                  session_name = result.get("name", "")
                  print(f"  ✅ Created session: {session_name}")
                  print(f"     View at: {session_url}")

                  # Create tracking issue
                  issue_body = f"""## 📅 Scheduled Jules Task: {title}

          **Task ID:** `{tid}`
          **Session:** [{session_name}]({session_url})
          **Plan approval required:** {require_approval}

          > Auto-dispatched by [workflow run `{run_id}`]({server_url}/{repo}/actions/runs/{run_id})
          """
                  gh_token = os.environ.get("GH_TOKEN", "")
                  if gh_token:
                      issue_payload = json.dumps({"title": f"[Jules] {title}", "body": issue_body, "labels": ["jules-automation"]}).encode()
                      try:
                          issue_req = urllib.request.Request(
                              f"{server_url}/api/v3/repos/{repo}/issues" if server_url != "https://github.com" else f"https://api.github.com/repos/{repo}/issues",
                              data=issue_payload,
                              headers={"Authorization": f"Bearer {gh_token}", "Content-Type": "application/json", "Accept": "application/vnd.github+json"},
                              method="POST")
                          issue_req.add_header("Authorization", "Bearer " + gh_token)
                          with urllib.request.urlopen(issue_req, timeout=20) as ir:
                              issue_data = json.loads(ir.read())
                          print(f"  📋 Issue: {issue_data.get('html_url', '')}")
                      except Exception as ie:
                          print(f"  ::warning::Could not create issue: {ie}")

              except urllib.error.HTTPError as e:
                  failures += 1
                  err_body = e.read().decode(errors="replace")
                  print(f"::error::Jules API error for {tid}: {e.code} {err_body}")
              except Exception as e:
                  failures += 1
                  print(f"::error::Unexpected error for {tid}: {e}")

          print(f"\nDone. Failures: {failures}")
          sys.exit(1 if failures else 0)
          PYEOF
