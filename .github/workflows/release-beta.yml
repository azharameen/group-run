# Beta & Deployment Test Lane
#
# Flow:
# 1. Push to test branches or workflow_dispatch -> Runs full build & deployment verification.
# 2. Merged PR into develop -> Computes beta tag, creates GitHub Release, and deploys to Cloud Run & Firebase Hosting.

name: Release - Beta & Deployment Test

on:
  workflow_dispatch:
  push:
    branches: ['*']

permissions:
  contents: write
  pull-requests: write
  issues: read
  id-token: write

jobs:
  beta-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute beta version
        id: version
        run: |
          echo "tag=v1.0.0-preview.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          if [ -f .github/scripts/beta-version.sh ]; then
            bash .github/scripts/beta-version.sh || true
          fi

      - name: Tag and create prerelease (Merged PRs only)
        if: github.event_name == 'pull_request' && github.event.pull_request && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'develop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.com"
          git tag "${{ steps.version.outputs.tag }}" || true
          git push origin "${{ steps.version.outputs.tag }}" || true
          gh release create "${{ steps.version.outputs.tag }}" --prerelease --title "${{ steps.version.outputs.tag }}" --target develop --generate-notes || true

      - name: Authenticate to Google Cloud
        id: auth
        if: ${{ secrets.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: ${{ secrets.GCP_SA_KEY != '' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Build & Deploy Backend to GCP Cloud Run
        if: ${{ secrets.GCP_SA_KEY != '' }}
        run: |
          gcloud run deploy backend-service \
            --source backend/ \
            --region ${{ secrets.GCP_REGION || 'asia-south1' }} \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 2 \
            --cpu 0.5 \
            --memory 256MiB

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend with Version Tag
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.tag }}
        run: |
          npm ci
          npm run build

      - name: Deploy Frontend to Firebase Hosting
        if: ${{ secrets.GCP_SA_KEY != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          channelId: live
          projectId: ${{ secrets.GCP_PROJECT_ID }}
          entryPoint: .


