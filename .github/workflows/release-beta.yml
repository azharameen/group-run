# Beta & Deployment Test Lane
#
# Flow:
# 1. Manual trigger (workflow_dispatch) OR PRs (pre-merge testing) -> Builds & deploys to Cloud Run & Firebase Hosting.
# 2. Merged PR into develop -> Computes beta tag, creates GitHub Release, and deploys to Cloud Run & Firebase Hosting.

name: Release - Beta & Deployment Test

on:
  workflow_dispatch:
  push:
    branches: [develop, 'test/**']
  pull_request:
    branches: [develop, main, 'test/**']

permissions:
  contents: write
  pull-requests: write
  issues: read
  id-token: write

jobs:
  beta-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute beta version
        id: version
        run: |
          if [ -f .github/scripts/beta-version.sh ]; then
            bash .github/scripts/beta-version.sh || echo "tag=v1.0.0-preview.${{ github.run_number }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.0-preview.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Tag and create prerelease (Merged PRs only)
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.com"
          git tag "${{ steps.version.outputs.tag }}" || true
          git push origin "${{ steps.version.outputs.tag }}" || true
          gh release create "${{ steps.version.outputs.tag }}" --prerelease --title "${{ steps.version.outputs.tag }}" --target develop --generate-notes || true

      - name: Authenticate to Google Cloud
        if: secrets.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: secrets.GCP_SA_KEY != ''
        uses: google-github-actions/setup-gcloud@v2

      - name: Build & Deploy Backend to GCP Cloud Run
        if: secrets.GCP_SA_KEY != ''
        env:
          GCP_REGION: ${{ secrets.GCP_REGION }}
        run: |
          gcloud run deploy backend-service \
            --source backend/ \
            --region "${GCP_REGION:-asia-south1}" \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 2 \
            --cpu 0.5 \
            --memory 256MiB

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend with Version Tag
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.tag }}
        run: |
          npm ci
          npm run build

      - name: Deploy Frontend to Firebase Hosting
        if: secrets.GCP_SA_KEY != ''
        run: |
          echo "Target GCP Project ID: ${{ secrets.GCP_PROJECT_ID }}"
          npm install -g firebase-tools
          firebase deploy --only hosting --project ${{ secrets.GCP_PROJECT_ID }} --non-interactive
