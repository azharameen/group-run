# Beta lane: develop.
#
# Flow: any PR merged into develop -> this workflow computes the next beta
# version using the SAME bump rules as the prod lane (release-please config),
# tags vX.Y.Z-beta.N and creates a prerelease GitHub Release with notes,
# builds & deploys Backend to GCP Cloud Run, and Frontend to Firebase Hosting.

name: Release - Beta

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read
  issues: read
  id-token: write

jobs:
  beta:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    environment: beta
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Test beta version calculator
        run: bash .github/scripts/test-beta-version.sh

      - name: Compute beta version
        id: version
        run: bash .github/scripts/beta-version.sh

      - name: Tag and create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
          args=(--prerelease --title "${{ steps.version.outputs.tag }}" --target develop --generate-notes)
          if [ -n "${{ steps.version.outputs.previous_tag }}" ]; then
            args+=(--notes-start-tag "${{ steps.version.outputs.previous_tag }}")
          fi
          gh release create "${{ steps.version.outputs.tag }}" "${args[@]}"

      - name: Authenticate to Google Cloud
        if: ${{ secrets.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: ${{ secrets.GCP_SA_KEY != '' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Build & Deploy Backend to GCP Cloud Run
        if: ${{ secrets.GCP_SA_KEY != '' }}
        run: |
          gcloud builds submit --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/backend:${{ steps.version.outputs.tag }} backend/
          gcloud run deploy backend-service \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/backend:${{ steps.version.outputs.tag }} \
            --region ${{ secrets.GCP_REGION || 'asia-south1' }} \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 2 \
            --cpu 0.5 \
            --memory 256MiB

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend with Beta Version Tag
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.tag }}
        run: |
          npm ci
          npm run build

      - name: Deploy Frontend to Firebase Hosting
        if: ${{ secrets.GCP_SA_KEY != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          channelId: live
          projectId: ${{ secrets.GCP_PROJECT_ID }}
