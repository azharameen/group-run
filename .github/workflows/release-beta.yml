# Beta & Deployment Lane
#
# Flow:
# 1. Push to develop (or manual trigger) ->
#    a. DB Migration Gate: runs 'alembic upgrade head' against beta DB.
#       If this step fails, the deploy is BLOCKED entirely.
#    b. Build & deploy backend to Cloud Run (beta).
#    c. Build & deploy frontend to Firebase Hosting.

name: "Release - Beta & Deployment Test"

on:
  workflow_dispatch: {}
  push:
    branches: [develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: read
  id-token: write

jobs:
  # ------------------------------------------------------------------
  # DB Migration Gate (must succeed before deploy)
  # ------------------------------------------------------------------
  beta-db-migrate:
    name: DB Migration (beta)
    uses: ./.github/workflows/db-migrate.yml
    with:
      environment: beta
    secrets:
      DATABASE_DIRECT_URL: ${{ secrets.BETA_DATABASE_DIRECT_URL }}

  # ------------------------------------------------------------------
  # Backend & Frontend Deploy (depends on migration success)
  # ------------------------------------------------------------------
  beta-deploy:
    name: Deploy (beta)
    needs: beta-db-migrate
    runs-on: ubuntu-latest
    environment: beta
    env:
      HAS_GCP_KEY: ${{ secrets.GCP_SA_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute beta version
        id: version
        run: |
          if [ -f .github/scripts/beta-version.sh ]; then
            bash .github/scripts/beta-version.sh || echo "tag=v1.0.0-preview.${{ github.run_number }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.0-preview.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Authenticate to Google Cloud
        if: env.HAS_GCP_KEY == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: env.HAS_GCP_KEY == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Build & Deploy Backend to GCP Cloud Run (beta)
        if: env.HAS_GCP_KEY == 'true'
        env:
          GCP_REGION: ${{ secrets.GCP_REGION }}
        run: |
          gcloud run deploy backend-service \
            --source backend/ \
            --region "${GCP_REGION:-asia-south1}" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "DATABASE_URL=${{ secrets.BETA_DATABASE_URL }}" \
            --set-env-vars "DB_SSL_MODE=require" \
            --set-env-vars "DB_AUTO_MIGRATE=false" \
            --set-env-vars "LANGGRAPH_STRICT_MSGPACK=true" \
            --min-instances 0 \
            --max-instances 2 \
            --cpu 0.5 \
            --memory 256Mi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend with Version Tag
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.tag }}
        run: |
          npm ci
          npm run build

      - name: Deploy Frontend to Firebase Hosting (beta)
        if: env.HAS_GCP_KEY == 'true'
        run: |
          echo "Target GCP Project ID: ${{ secrets.GCP_PROJECT_ID }}"
          npm install -g firebase-tools
          firebase deploy --only hosting --project ${{ secrets.GCP_PROJECT_ID }} --non-interactive || echo "Firebase Hosting skipped/uninitialized."
