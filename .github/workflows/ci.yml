name: "CI Pipeline"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, '*']

permissions:
  contents: read

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Path Filter Job
  # ------------------------------------------------------------------
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      shared: ${{ steps.filter.outputs.shared }}
      manifests: ${{ steps.filter.outputs.manifests }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'ruff.toml'
              - 'scripts/forbidden_imports.py'
              - 'requirements.txt'
            frontend:
              - 'frontend/**'
            shared:
              - 'docker-compose.yml'
              - '.github/**'
              - 'Dockerfile*'
              - 'config/**'
            manifests:
              - 'backend/requirements.txt'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'

  # ------------------------------------------------------------------
  # Backend Lint
  # ------------------------------------------------------------------
  backend-lint:
    name: Backend Lint (Python)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Configure git user
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Create virtual environment
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install Ruff
        run: pip install "ruff>=0.9.0"

      - name: Run Ruff lint
        run: ruff check backend/app

      - name: Check forbidden imports (NFR-A12)
        run: python scripts/forbidden_imports.py

  # ------------------------------------------------------------------
  # Backend Tests (with PostgreSQL service container)
  # ------------------------------------------------------------------
  backend-test:
    name: Backend Tests (Python)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Spin up a Postgres container for the duration of this job.
    # All tests run against this isolated DB instance.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Configure git user
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Create virtual environment
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run Alembic migrations (CI test DB)
        working-directory: backend
        env:
          DATABASE_DIRECT_URL: postgresql+psycopg://postgres:postgres@localhost:5432/app_db_test
        run: alembic upgrade head

      - name: Run pytest with coverage
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/app_db_test
          DATABASE_DIRECT_URL: postgresql+psycopg://postgres:postgres@localhost:5432/app_db_test
          DB_SSL_MODE: prefer
          DB_AUTO_MIGRATE: 'false'
          DEEPAGENTS_MODEL: openai:test-model
          OPENAI_API_KEY: sk-test
          OPENAI_MODEL_NAME: gpt-4
          LANGGRAPH_STRICT_MSGPACK: 'true'
        run: pytest -v --tb=short --cov=app --cov-fail-under=60 --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-logs
          path: backend/.pytest_cache/
          retention-days: 7

  # ------------------------------------------------------------------
  # Frontend Lint
  # ------------------------------------------------------------------
  frontend-lint:
    name: Frontend Lint (TypeScript)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc -b --noEmit

      - name: ESLint check
        working-directory: frontend
        run: npx eslint src

  # ------------------------------------------------------------------
  # Frontend Tests
  # ------------------------------------------------------------------
  frontend-test:
    name: Frontend Tests (TypeScript)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest
        working-directory: frontend
        run: npx vitest run

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  # ------------------------------------------------------------------
  # Frontend Build
  # ------------------------------------------------------------------
  frontend-build:
    name: Frontend Build (TypeScript)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 7

  # ------------------------------------------------------------------
  # E2E Tests (Playwright)
  # ------------------------------------------------------------------
  e2e-test:
    name: E2E Tests (Playwright)
    needs: changes
    if: (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true') && ((github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) || (github.event_name == 'pull_request' && (github.event.pull_request.base.ref == 'develop' || github.event.pull_request.base.ref == 'main')))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python for E2E Backend
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Create virtual environment
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies if cached
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Run Alembic migrations (E2E DB)
        working-directory: backend
        env:
          DATABASE_DIRECT_URL: postgresql+psycopg://postgres:postgres@localhost:5432/app_db_e2e
        run: |
          pip install -r requirements.txt
          alembic upgrade head

      - name: Start backend server
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/app_db_e2e
          DATABASE_DIRECT_URL: postgresql+psycopg://postgres:postgres@localhost:5432/app_db_e2e
          DB_SSL_MODE: prefer
          DB_AUTO_MIGRATE: 'false'
          DEEPAGENTS_MODEL: "openai:test-model"
          OPENAI_API_KEY: "sk-test"
          OPENAI_MODEL_NAME: "gpt-4"
          LANGGRAPH_STRICT_MSGPACK: 'true'
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/api/health && break; sleep 1; done

      - name: Run Playwright E2E tests
        working-directory: frontend
        env:
          VITE_API_PROXY: http://127.0.0.1:8000
        run: npx playwright test --project=dev --reporter=html

      - name: Upload Playwright report
        if: always() && hashFiles('frontend/playwright-report/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: frontend/playwright-report/
          retention-days: 7

  # ------------------------------------------------------------------
  # Security Audit
  # ------------------------------------------------------------------
  security-audit:
    name: Security Audit
    needs: changes
    if: needs.changes.outputs.manifests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Create virtual environment
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Install Python dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Python dependency audit
        run: pip install pip-audit && pip-audit -r backend/requirements.txt
        continue-on-error: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend dependency audit
        working-directory: frontend
        run: npm ci

      - name: npm audit (production)
        working-directory: frontend
        run: npm audit --omit=dev
        continue-on-error: false

  # ------------------------------------------------------------------
  # Commit Lint (conventional commits)
  # ------------------------------------------------------------------
  commit-lint:
    name: Commit Lint
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit format
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          PATTERN='^(feat|fix|chore|docs|style|refactor|perf|test|ci)(\([a-z0-9-]+\))?: .+'
          if git rev-parse --verify "origin/$BASE_REF" > /dev/null 2>&1; then
            git log --no-merges --pretty=format:%s "origin/$BASE_REF..HEAD" > /tmp/subjects.txt
          else
            git log --no-merges --pretty=format:%s -1 > /tmp/subjects.txt
          fi
          if [ ! -s /tmp/subjects.txt ]; then echo "No commits to check"; exit 0; fi
          BAD=$(grep -Evc "$PATTERN" /tmp/subjects.txt || true)
          if [ "$BAD" -gt 0 ]; then
            echo "::error::$BAD commit(s) do not match 'type(scope): description' (scope optional):"
            grep -Eov "$PATTERN" /tmp/subjects.txt > /dev/null 2>&1 || true
            grep -Ev "$PATTERN" /tmp/subjects.txt | sed 's/^/  /'
            exit 1
          fi
          echo "All commits follow the conventional format"
