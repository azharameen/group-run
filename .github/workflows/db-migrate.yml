# Reusable workflow: run Alembic migrations against a target environment.
#
# Called by release-beta.yml and release-prod.yml BEFORE the Cloud Run
# deploy step. If migrations fail, the deploy is blocked entirely —
# the running app stays on the old schema and the old image.
#
# Inputs:
#   environment:  GitHub environment name (beta | production) for secret scoping.
#
# Secrets:
#   DATABASE_DIRECT_URL: psycopg v3 direct connection URL (not a pooler).
#                        Production (Supabase): port 5432 direct URL.

name: DB Migrate

on:
  workflow_call:
    inputs:
      environment:
        description: 'GitHub environment (beta | production)'
        required: true
        type: string
    secrets:
      DATABASE_DIRECT_URL:
        required: true

jobs:
  migrate:
    name: 'Alembic: upgrade head (${{ inputs.environment }})'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Verify migration chain (dry-run SQL)
        working-directory: backend
        env:
          DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
        run: |
          echo '--- Dry-run: SQL that would be applied ---'
          alembic upgrade head --sql
          echo '--- Dry-run complete ---'

      - name: Run Alembic upgrade head
        working-directory: backend
        env:
          DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
        run: alembic upgrade head

      - name: Verify migration head
        working-directory: backend
        env:
          DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
        run: |
          alembic current --verbose
          echo "### Database migration (${{ inputs.environment }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- Migration head: \`$(alembic heads | tr '\n' ' ')\`" >> "$GITHUB_STEP_SUMMARY"
          echo 'Migration completed successfully.'
