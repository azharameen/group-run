# Production lane: main only.
#
# Flow: any PR merged into main ->
#   1. DB Migration Gate: runs 'alembic upgrade head' against production DB.
#      If this step fails, the release and deploy are BLOCKED entirely.
#   2. release-please opens (or updates) the "chore(main): release x.y.z" PR.
#      MERGING THAT PR IS THE RELEASE: tag vX.Y.Z + CHANGELOG.md + GitHub Release.
#   3. Deploy backend to the shared Cloud Run service.
#   4. Deploy frontend to the shared Firebase Hosting target.
#
# Shared-target mode: beta and production intentionally use the same
# infrastructure until beta has users. Production requires environment approval.
#
# Version law (see .release-please-config.json):
#   fix:/perf: -> patch | feat: -> minor | breaking -> minor while < 1.0.0
#   1.0.0 is a human declaration (Release-As: 1.0.0), never an accident.
#
# Required secrets (environment: production):
#   PROD_DATABASE_DIRECT_URL  — Supabase direct port 5432 (for Alembic DDL)
#   PROD_DATABASE_URL         — Supabase Transaction Pooler port 6543 (for runtime)
#   GCP_SA_KEY                — GCP Service Account JSON
#   GCP_PROJECT_ID            — GCP project ID
#   GCP_REGION                — GCP region (default: asia-south1)

name: Release - Production

on:
  pull_request:
    branches: [main]
    types: [closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  prod-config:
    name: Validate deployment configuration (production)
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require deployment secrets
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
          PROD_DATABASE_DIRECT_URL: ${{ secrets.PROD_DATABASE_DIRECT_URL }}
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          missing=()
          for name in GCP_SA_KEY GCP_PROJECT_ID PROD_DATABASE_DIRECT_URL PROD_DATABASE_URL; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing required production deployment configuration: %s\n' "${missing[*]}"
            exit 1
          fi

  # ------------------------------------------------------------------
  # DB Migration Gate (must succeed before release & deploy)
  # ------------------------------------------------------------------
  prod-db-migrate:
    name: DB Migration (production)
    needs: prod-config
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    uses: ./.github/workflows/db-migrate.yml
    with:
      environment: production
    secrets:
      DATABASE_DIRECT_URL: ${{ secrets.PROD_DATABASE_DIRECT_URL }}

  # ------------------------------------------------------------------
  # Release Please (creates/updates the release PR + tags)
  # ------------------------------------------------------------------
  release-please:
    name: Release Please
    needs: prod-db-migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: google-github-actions/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------
  # Production Deploy
  # ------------------------------------------------------------------
  prod-deploy:
    name: Deploy (production)
    needs: [prod-db-migrate, release-please]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build & Deploy Backend to shared Cloud Run service (production)
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ secrets.GCP_REGION || vars.GCP_REGION || 'asia-south1' }}
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'backend-service' }}
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --source backend/ \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "DATABASE_URL=$DATABASE_URL" \
            --set-env-vars "DB_SSL_MODE=require" \
            --set-env-vars "DB_AUTO_MIGRATE=false" \
            --set-env-vars "LANGGRAPH_STRICT_MSGPACK=true" \
            --set-env-vars "APP_ROOT_DIR=/app" \
            --set-env-vars "FIREBASE_PROJECT_ID=$GCP_PROJECT_ID" \
            --min-instances 0 \
            --max-instances 3 \
            --cpu 1 \
            --memory 512Mi \
            --concurrency 20

          BACKEND_URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='value(status.url)')"
          REVISION="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='value(status.latestReadyRevisionName)')"
          echo "BACKEND_URL=$BACKEND_URL" >> "$GITHUB_ENV"
          echo "REVISION=$REVISION" >> "$GITHUB_ENV"
          curl --fail --silent --show-error --retry 10 --retry-delay 5 \
            "$BACKEND_URL/api/health"
          curl --fail --silent --show-error --retry 10 --retry-delay 5 \
            "$BACKEND_URL/api/ready"
          {
            echo "### Production deployment"
            echo ""
            echo "- Shared Cloud Run service: \`$CLOUD_RUN_SERVICE\`"
            echo "- Backend URL: $BACKEND_URL"
            echo "- Revision: \`$REVISION\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Shared-target mode: production deployment currently owns the shared revision"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build & Deploy Frontend to Firebase Hosting (production)
        env:
          VITE_API_URL: /api
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
        run: |
          set -euo pipefail
          ACTIVE_ACCOUNT="$(gcloud auth list \
            --filter='status:ACTIVE' \
            --format='value(account)' | head -n 1)"
          echo "Google Cloud deployment identity: $ACTIVE_ACCOUNT"
          if ! FIRESTORE_STATUS="$(gcloud services describe firestore.googleapis.com \
            --project "$GCP_PROJECT_ID" \
            --format='value(config.name)' 2>&1)"; then
            printf '%s\n' "$FIRESTORE_STATUS" >&2
            echo "::error::Unable to read Firestore API status as $ACTIVE_ACCOUNT in project $GCP_PROJECT_ID. The Google Cloud error above identifies whether the API is disabled or the identity lacks roles/serviceusage.serviceUsageConsumer."
            exit 1
          fi
          npm ci --prefix frontend
          npm run build --prefix frontend
          npm exec --prefix frontend -- firebase deploy \
            --only hosting,firestore:rules \
            --project "$GCP_PROJECT_ID" \
            --non-interactive
          curl --fail --silent --show-error "https://${GCP_PROJECT_ID}.web.app/"
          {
            echo "- Frontend URL: https://${GCP_PROJECT_ID}.web.app/"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
