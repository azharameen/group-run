# Production lane: main only.
#
# Flow: any PR merged into main ->
#   1. DB Migration Gate: runs 'alembic upgrade head' against production DB.
#      If this step fails, the release and deploy are BLOCKED entirely.
#   2. release-please opens (or updates) the "chore(main): release x.y.z" PR.
#      MERGING THAT PR IS THE RELEASE: tag vX.Y.Z + CHANGELOG.md + GitHub Release.
#   3. Deploy backend to Cloud Run (production).
#   4. Deploy frontend to Firebase Hosting (production).
#
# Version law (see .release-please-config.json):
#   fix:/perf: -> patch | feat: -> minor | breaking -> minor while < 1.0.0
#   1.0.0 is a human declaration (Release-As: 1.0.0), never an accident.
#
# Required secrets (environment: production):
#   PROD_DATABASE_DIRECT_URL  — Supabase direct or free Shared Pooler session
#                                mode port 5432 (for Alembic DDL)
#   PROD_DATABASE_URL         — Supabase Transaction Pooler port 6543 (for runtime)
#   GCP_SA_KEY                — GCP Service Account JSON
#   GCP_PROJECT_ID            — GCP project ID
#   GCP_REGION                — GCP region (default: asia-south1)

name: Release - Production

on:
  pull_request:
    branches: [main]
    types: [closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  # ------------------------------------------------------------------
  # DB Migration Gate (must succeed before release & deploy)
  # ------------------------------------------------------------------
  prod-db-migrate:
    name: DB Migration (production)
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    uses: ./.github/workflows/db-migrate.yml
    with:
      environment: production
    secrets:
      DATABASE_DIRECT_URL: ${{ secrets.PROD_DATABASE_DIRECT_URL }}

  # ------------------------------------------------------------------
  # Release Please (creates/updates the release PR + tags)
  # ------------------------------------------------------------------
  release-please:
    name: Release Please
    needs: prod-db-migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: google-github-actions/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------
  # Production Deploy
  # ------------------------------------------------------------------
  prod-deploy:
    name: Deploy (production)
    needs: [prod-db-migrate, release-please]
    runs-on: ubuntu-latest
    environment: production
    env:
      HAS_GCP_KEY: ${{ secrets.GCP_SA_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        if: env.HAS_GCP_KEY == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: env.HAS_GCP_KEY == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Build & Deploy Backend to GCP Cloud Run (production)
        if: env.HAS_GCP_KEY == 'true'
        env:
          GCP_REGION: ${{ secrets.GCP_REGION }}
        run: |
          gcloud run deploy backend-service \
            --source backend/ \
            --region "${GCP_REGION:-asia-south1}" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}" \
            --set-env-vars "DB_SSL_MODE=require" \
            --set-env-vars "DB_AUTO_MIGRATE=false" \
            --set-env-vars "LANGGRAPH_STRICT_MSGPACK=true" \
            --min-instances 1 \
            --max-instances 10 \
            --cpu 1 \
            --memory 512Mi

      - name: Set up Node.js
        if: env.HAS_GCP_KEY == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build & Deploy Frontend to Firebase Hosting (production)
        if: env.HAS_GCP_KEY == 'true'
        run: |
          npm install -g firebase-tools
          npm ci --prefix frontend
          npm run build --prefix frontend
          firebase deploy --only hosting --project ${{ secrets.GCP_PROJECT_ID }} --non-interactive
