# Dependabot update strategy
# - weekly cadence for both ecosystems
# - npm dev-dependencies minor/patch are grouped into one PR
# - MAJOR updates (e.g. vite 5 -> 8) always land as standalone PRs
#   for human review — they are upgrade stories, not chores
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-resizable-panels"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-dev-deps:
        dependency-type: "development"
        patterns:
          - "*"
