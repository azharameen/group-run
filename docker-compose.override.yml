# LOCAL-ONLY overrides (never commit). Auto-applied by `docker compose` in
# this directory; deployment/pipeline use the plain docker-compose.yml.
#
# Fixes two pre-existing develop drifts without touching tracked files:
# 1. backend/Dockerfile listens on 8080 (Cloud Run PR), but compose maps and
#    health-checks 8000/`/health` — remap port and fix health path.
# 2. The backend image has no alembic files (Dockerfile only copies
#    app/, config/, instructions/), so DB_AUTO_MIGRATE=true silently skips —
#    mount the local alembic dir + ini into /app so
#    `alembic upgrade head` can run at startup.
services:
  postgres:
    healthcheck:
      interval: 6h
  backend:
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8080
    environment:
      DB_AUTO_MIGRATE: "false"
    ports: !override
      - "8000:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 6h
      timeout: 5s
      retries: 12
      start_period: 40s
    volumes:
      - ./backend/alembic:/app/alembic:ro
      - ./backend/alembic.ini:/app/alembic.ini:ro
  frontend:
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 6h
      timeout: 5s
      retries: 12
      start_period: 15s
    volumes:
      - ./frontend/nginx-local.conf:/etc/nginx/nginx.conf:ro
