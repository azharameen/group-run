# Enforcement: Retro action item gate for story development
# Prevents dev work from starting if prior epic action items are open.
# Place: _bmad/custom/bmad-dev-story.toml (team override, git-commit this)

[workflow]

activation_steps_prepend = [
  """Run: `python {project-root}/_bmad/scripts/check_action_items.py --sprint-status {project-root}/_bmad-output/implementation-artifacts/sprint-status.yaml` and parse the output.

If output is "clear", continue activation normally.

If output starts with "blockers:N":
  1. Present the blocker list to the user with this header:
     "⚠️ N action items from prior epics are still open:"
  2. List each blocker with its epic, action, and owner
  3. Ask: "Proceed with dev work despite these open items? (yes/no)"
  4. If user says "no" or "wait", HALT immediately - do not continue
  5. If user says "yes", log "User acknowledged N open action items" and continue activation"""
]

# AD-18/AD-19: status transitions during story development (team policy).
# Authority: ARCHITECTURE-SPINE.md AD-18 (sync loop) and AD-19 (status lifecycle).

persistent_facts = [
  "file:{project-root}/_bmad-output/implementation-artifacts/github-board.md",
  "AD-19 transitions: at story start set the story AND its parent epic to In Progress; when the PR is opened set the story to In Review; when merged to develop set the story to Done. An epic only becomes Done at retrospective (all children Done + retro complete). Deferred work is On Hold plus a deferred-work ledger entry."
]

on_complete = "GH-SYNC (AD-19): apply this story's status transition on the Group Run board (start: story + parent epic In Progress; PR opened: story In Review; merged: story Done). Re-sync the issue body with the final implementation notes. Verify with a GraphQL re-query; log any item that could not be synced in the deferred-work ledger."
