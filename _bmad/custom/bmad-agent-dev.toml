# Commander branch and PR policy enforcement for dev agent
# Place: _bmad/custom/bmad-agent-dev.toml (team override, git-commit this)

[workflow.persistent_facts]
branch_rules = """
BRANCH_POLICY: Always create feature branches from develop
PR_POLICY: One story = one PR, target develop branch
NEVER merge directly to main or develop
HOTFIX_EXCEPTION: hotfix/ branches may target main directly, then sync to develop
"""
