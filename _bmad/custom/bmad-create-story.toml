# Enforcement: Retro action item gate for story creation
# Prevents story creation if prior epic action items are open.
# Place: _bmad/custom/bmad-create-story.toml (team override, git-commit this)

[workflow]

activation_steps_prepend = [
  """Run: `python {project-root}/_bmad/scripts/check_action_items.py --sprint-status {project-root}/_bmad-output/implementation-artifacts/sprint-status.yaml` and parse the output.

If output is "clear", continue activation normally.

If output starts with "blockers:N":
  1. Present the blocker list to the user with this header:
     "⚠️ N action items from prior epics are still open:"
  2. List each blocker with its epic, action, and owner
  3. Ask: "Proceed with story creation despite these open items? (yes/no)"
  4. If user says "no" or "wait", HALT immediately - do not continue
  5. If user says "yes", log "User acknowledged N open action items" and continue activation"""
]

# Commander-specific story template requirements — persistent_facts under [workflow] (appends to base skill's array)
persistent_facts = [
  "STORY_TEMPLATE: Every new story MUST include these sections: Intent Contract (Problem, Approach, Boundaries), Code Map (File Targets, Dependencies, Integration Points), Branch Strategy (Branch name, Base branch, PR Target).",
  "BRANCH_STRATEGY: Use 'Branch: feat/<story-key>-<desc>', 'Base: develop', 'PR Target: develop'. For hotfixes use 'Branch: hotfix/<issue>', 'Base: main', 'PR Target: main (then sync to develop)'."
]
