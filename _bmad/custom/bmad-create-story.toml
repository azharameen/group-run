# Enforcement: Retro action item gate for story creation
# Prevents story creation if prior epic action items are open.
# Place: _bmad/custom/bmad-create-story.toml (team override, git-commit this)

[workflow]

activation_steps_prepend = [
  """Run: `python {project-root}/_bmad/scripts/check_action_items.py --sprint-status {project-root}/_bmad-output/implementation-artifacts/sprint-status.yaml` and parse the output.

If output is "clear", continue activation normally.

If output starts with "blockers:N":
  1. Present the blocker list to the user with this header:
     "⚠️ N action items from prior epics are still open:"
  2. List each blocker with its epic, action, and owner
  3. Ask: "Proceed with story creation despite these open items? (yes/no)"
  4. If user says "no" or "wait", HALT immediately - do not continue
  5. If user says "yes", log "User acknowledged N open action items" and continue activation"""
]

# AD-18/AD-19: story file to GitHub issue sync (team policy).
# Authority: ARCHITECTURE-SPINE.md AD-18 (sync loop) and AD-19 (status lifecycle).

persistent_facts = [
  "file:{project-root}/_bmad-output/implementation-artifacts/github-board.md",
  "The story file is the source of truth for content; the GitHub issue body is a generated mirror that is re-synced whenever the story file is created or updated.",
  "E2E AC line (AD-21, 2026-08-18): every story file's Acceptance Criteria section must include a standing e2e criterion: 'e2e: test case(s) for the story's primary user flow (extend the feature-area spec under frontend/e2e/, or create one); any deferral must be recorded in _bmad-output/implementation-artifacts/deferred-work.md with reason.' Non-UI stories carry the line as 'e2e: N/A (no user-facing flow) - <reason>'."
]

on_complete = "GH-SYNC (AD-18/AD-19): sync this story file to its GitHub issue - full body (story text + acceptance criteria + meta + source + hierarchy line), Status = Backlog, Issue Type = Story, Sprint, milestone and parent epic. If the linked issue does not exist yet, create it as a sub-issue of the epic first. Verify with a GraphQL re-query; log any item that could not be synced in the deferred-work ledger."
