# jules-tasks.yaml
# =================
# Scheduled Jules tasks — used by .github/workflows/jules-scheduled.yml
# Each task runs Jules on a cron schedule.
#
# Fields:
#   id          — unique task identifier (used for issue deduplication)
#   title       — human label shown in issue / Jules session title
#   prompt      — full Jules task description
#   schedule    — cron expression (UTC)
#   enabled     — set to false to disable without deleting the task
#   require_plan_approval  — pause Jules for plan review (default true)
#   auto_create_pr         — Jules opens a PR when done (default true)

tasks:
  - id: "weekly-dep-audit"
    title: "Weekly: Dependency security audit + upgrade"
    enabled: true
    schedule: "0 3 * * 1"  # every Monday 03:00 UTC
    require_plan_approval: true
    auto_create_pr: true
    prompt: |
      Perform a dependency maintenance pass on this repository.

      1. Run `pip-audit` on backend/requirements.txt and note any HIGH/CRITICAL CVEs.
      2. Run `npm audit --production` on frontend/package-lock.json and note any HIGH/CRITICAL CVEs.
      3. For each identified HIGH/CRITICAL vulnerability, upgrade the affected package to the latest
         non-breaking version that resolves it.
      4. Run the existing backend tests (`pytest -v --tb=short`) and frontend tests (`npx vitest run`)
         to confirm nothing breaks after upgrades.
      5. Update requirements.txt and package.json / package-lock.json accordingly.
      6. Do not change any application code — only dependency manifests.
      7. Commit with message: [Jules] chore: weekly dependency security upgrade

  - id: "weekly-todo-sweep"
    title: "Weekly: TODO/FIXME comment sweep"
    enabled: true
    schedule: "0 4 * * 1"  # every Monday 04:00 UTC
    require_plan_approval: true
    auto_create_pr: false
    prompt: |
      Scan the entire codebase for inline TODO, FIXME, HACK, and XXX comments.
      For each one found:
      1. Evaluate whether it is still relevant (has the issue already been fixed?).
      2. If still relevant and low-risk (< 10 lines of change), fix it inline.
      3. If it requires a larger change, create a GitHub issue describing the problem and
         reference the file + line number.
      4. Remove the comment once addressed or the issue is filed.
      Do not change any test logic or APIs — only address the annotated concerns.
      Commit message for any code fixes: [Jules] chore: address TODO/FIXME comments

  - id: "weekly-coverage-boost"
    title: "Weekly: Add missing unit tests for low-coverage modules"
    enabled: false   # enable after the project stabilises
    schedule: "0 5 * * 3"  # every Wednesday 05:00 UTC
    require_plan_approval: true
    auto_create_pr: true
    prompt: |
      Identify the 3 Python modules in backend/app/ with the lowest test coverage
      (use `pytest --cov=app --cov-report=term-missing` to find them).
      For each module, write meaningful unit tests that cover the untested branches.
      Tests must:
      - Use the existing pytest + fixtures patterns in backend/tests/.
      - Not duplicate existing test cases.
      - Pass without requiring schema or API changes.
      Target: raise each module's coverage to at least 70%.
      Commit message: [Jules] test: add unit tests for low-coverage modules
